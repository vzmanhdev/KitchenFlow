services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kitchenflow
      POSTGRES_USER: kitchenflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:
